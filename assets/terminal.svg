<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="326" viewBox="0 0 1200 326" role="img" aria-label="Terminal: whoami, Aman Singh, founding engineer at Gradstack and UTS graduate. Latest writing: day-zero, railway-breach, php2shell, memora-slack-agent.">
