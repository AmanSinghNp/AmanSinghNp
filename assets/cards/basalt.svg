<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="Basalt: Bare-metal f-k noise attenuation for seismic data.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a16"/>
      <stop offset="1" stop-color="#0c1326"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="600" height="200" rx="18"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a0cbad" stop-opacity="0.16"/><stop offset="0.6" stop-color="#a0cbad" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a0cbad" stop-opacity="0"/><stop offset="0.5" stop-color="#a0cbad"/><stop offset="1" stop-color="#a0cbad" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="200" fill="url(#bg)"/>
    <rect width="600" height="200" fill="url(#grid)"/>
    <rect width="600" height="200" fill="url(#glow)"/>
    <rect x="-200" y="0" width="200" height="2" fill="url(#edge)"><animate attributeName="x" values="-200;600" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="0" y="0" width="4" height="200" fill="#a0cbad" fill-opacity="0.85"/>
    <text x="28" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="1.2" fill="#a0cbad">C++ · SIMD</text>
    <text x="28" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#f4f7f9">Basalt</text>
    <text x="28" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a9bacb">Bare-metal f-k noise attenuation for seismic data.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#d5e0e6"><g transform="translate(28 146)"><rect width="60" height="30" rx="15" fill="#a0cbad" fill-opacity="0.1" stroke="#a0cbad" stroke-opacity="0.35"/><text x="30.2" y="20.5" text-anchor="middle">mmap</text></g><g transform="translate(96 146)"><rect width="142" height="30" rx="15" fill="#a0cbad" fill-opacity="0.1" stroke="#a0cbad" stroke-opacity="0.35"/><text x="71.2" y="20.5" text-anchor="middle">memory arenas</text></g></g>
    <g transform="translate(544 58)"><clipPath id="wc"><rect x="-24" y="-16" width="48" height="32"/></clipPath>
        <g clip-path="url(#wc)"><path d="M-60 0 L-56 2.2 L-52 -2.2 L-48 2.2 L-44 -2.2 L-40 9.0 L-36 -9.0 L-32 9.0 L-28 -9.0 L-24 9.0 L-20 -9.0 L-16 2.2 L-12 -2.2 L-8 2.2 L-4 -2.2 L0 2.2 L4 -2.2 L8 2.2 L12 -2.2 L16 2.2 L20 -9.0 L24 9.0 L28 -9.0 L32 9.0 L36 -9.0 L40 9.0 L44 -2.2 L48 2.2 L52 -2.2 L56 2.2 L60 -2.2" fill="none" stroke="#a0cbad" stroke-width="1.8" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;-60 0" dur="2.4s" repeatCount="indefinite"/></path></g></g>
    <path d="M556 172 L570 158 M559 158 H570 V169" fill="none" stroke="#6e95a4" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="199" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
