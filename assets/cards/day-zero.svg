<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="Day zero: Seven incidents in ten days, and what AI changes.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a16"/>
      <stop offset="1" stop-color="#0c1326"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="600" height="200" rx="18"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.16"/><stop offset="0.6" stop-color="#ff6a3d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0"/><stop offset="0.5" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="200" fill="url(#bg)"/>
    <rect width="600" height="200" fill="url(#grid)"/>
    <rect width="600" height="200" fill="url(#glow)"/>
    <rect x="-200" y="0" width="200" height="2" fill="url(#edge)"><animate attributeName="x" values="-200;600" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="0" y="0" width="4" height="200" fill="#ff6a3d" fill-opacity="0.85"/>
    <text x="28" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="1.2" fill="#ff6a3d">OCT 2026 · 17 MIN READ</text>
    <text x="28" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#f4f7f9">Day zero</text>
    <text x="28" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a9bacb">Seven incidents in ten days, and what AI changes.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#d5e0e6"><g transform="translate(28 146)"><rect width="106" height="30" rx="15" fill="#ff6a3d" fill-opacity="0.1" stroke="#ff6a3d" stroke-opacity="0.35"/><text x="52.9" y="20.5" text-anchor="middle">PHP2Shell</text></g><g transform="translate(142 146)"><rect width="88" height="30" rx="15" fill="#ff6a3d" fill-opacity="0.1" stroke="#ff6a3d" stroke-opacity="0.35"/><text x="43.8" y="20.5" text-anchor="middle">LiteLLM</text></g><g transform="translate(238 146)"><rect width="97" height="30" rx="15" fill="#ff6a3d" fill-opacity="0.1" stroke="#ff6a3d" stroke-opacity="0.35"/><text x="48.4" y="20.5" text-anchor="middle">OpenCode</text></g></g>
    <g transform="translate(544 58)"><circle r="20" fill="none" stroke="#ff6a3d" stroke-opacity="0.35"/><circle r="11" fill="none" stroke="#ff6a3d" stroke-opacity="0.25"/>
        <path d="M0 0 L0 -20 A20 20 0 0 1 17.3 -10 Z" fill="#ff6a3d" fill-opacity="0.35"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/></path>
        <circle cx="8" cy="-9" r="2.5" fill="#ff6a3d"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle></g>
    <path d="M556 172 L570 158 M559 158 H570 V169" fill="none" stroke="#6e95a4" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="199" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
