<svg xmlns="http://www.w3.org/2000/svg" width="600" height="262" viewBox="0 0 600 262" role="img" aria-label="LiPi Sort. Reads handwritten postcodes off postcards, then a robot arm sorts them.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: #f0f3f6; }
    .context { font-size: 19px; fill: #8b949e; }
    .body { font-size: 22px; fill: #c9d1d9; }
    .stack { font-size: 19px; fill: #6e95a4; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .spin { transform-origin: 0 0; animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .scroll { animation: scroll 2.4s linear infinite; }
    @keyframes scroll { to { transform: translateX(-60px); } }
    @media (prefers-reduced-motion: reduce) { .pulse, .spin, .scroll { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="599" height="261" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="28" y="28" width="68" height="68" rx="14" fill="#7cc4ff" fill-opacity="0.12"/>
  <g transform="translate(62 62)" color="#7cc4ff"><g stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"><line x1="-13" y1="8" x2="0" y2="-11"/><line x1="0" y1="-11" x2="13" y2="8"/><line x1="-13" y1="8" x2="0" y2="2"/><line x1="13" y1="8" x2="0" y2="2"/><line x1="0" y1="-11" x2="0" y2="2"/></g><circle class="pulse" style="animation-delay:0.0s" cx="-13" cy="8" r="4" fill="currentColor"/><circle class="pulse" style="animation-delay:0.6s" cx="0" cy="-11" r="4" fill="currentColor"/><circle class="pulse" style="animation-delay:1.2s" cx="13" cy="8" r="4" fill="currentColor"/><circle class="pulse" style="animation-delay:1.7999999999999998s" cx="0" cy="2" r="4" fill="currentColor"/></g>
  <text x="116" y="62" class="title">LiPi Sort</text>
  <text x="116" y="90" class="context">People&#x27;s Choice, UTS Tech Fest 2026</text>
  <text x="28" y="152" class="body">Reads handwritten postcodes off postcards,</text><text x="28" y="183" class="body">then a robot arm sorts them.</text>
  <text x="28" y="234" class="stack">YOLO11s, EasyOCR, SO-101 arm</text>
</svg>
