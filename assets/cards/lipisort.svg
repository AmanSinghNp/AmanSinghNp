<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="LiPi Sort: Reads handwritten postcodes. A robot arm sorts the mail.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a16"/>
      <stop offset="1" stop-color="#0c1326"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="600" height="200" rx="18"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.16"/><stop offset="0.6" stop-color="#7cc4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0"/><stop offset="0.5" stop-color="#7cc4ff"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="200" fill="url(#bg)"/>
    <rect width="600" height="200" fill="url(#grid)"/>
    <rect width="600" height="200" fill="url(#glow)"/>
    <rect x="-200" y="0" width="200" height="2" fill="url(#edge)"><animate attributeName="x" values="-200;600" dur="5s" begin="-0.00s" repeatCount="indefinite"/></rect>
    <rect x="0" y="0" width="4" height="200" fill="#7cc4ff" fill-opacity="0.85"/>
    <text x="28" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="1.2" fill="#7cc4ff">PEOPLE&#x27;S CHOICE · UTS TECH FEST 2026</text>
    <text x="28" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#f4f7f9">LiPi Sort</text>
    <text x="28" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a9bacb">Reads handwritten postcodes. A robot arm sorts the mail.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#d5e0e6"><g transform="translate(28 146)"><rect width="88" height="30" rx="15" fill="#7cc4ff" fill-opacity="0.1" stroke="#7cc4ff" stroke-opacity="0.35"/><text x="43.8" y="20.5" text-anchor="middle">YOLO11s</text></g><g transform="translate(124 146)"><rect width="88" height="30" rx="15" fill="#7cc4ff" fill-opacity="0.1" stroke="#7cc4ff" stroke-opacity="0.35"/><text x="43.8" y="20.5" text-anchor="middle">EasyOCR</text></g><g transform="translate(219 146)"><rect width="79" height="30" rx="15" fill="#7cc4ff" fill-opacity="0.1" stroke="#7cc4ff" stroke-opacity="0.35"/><text x="39.3" y="20.5" text-anchor="middle">SO-101</text></g></g>
    <g transform="translate(544 58)"><g stroke="#7cc4ff" stroke-opacity="0.35" stroke-width="1.5"><line x1="-14" y1="8" x2="0" y2="-12"/><line x1="0" y1="-12" x2="14" y2="8"/><line x1="-14" y1="8" x2="0" y2="2"/><line x1="14" y1="8" x2="0" y2="2"/><line x1="0" y1="-12" x2="0" y2="2"/></g><circle cx="-14" cy="8" r="4" fill="#7cc4ff"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2.4s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="0" cy="-12" r="4" fill="#7cc4ff"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin="0.60s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2.4s" begin="0.60s" repeatCount="indefinite"/></circle><circle cx="14" cy="8" r="4" fill="#7cc4ff"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin="1.20s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2.4s" begin="1.20s" repeatCount="indefinite"/></circle><circle cx="0" cy="2" r="4" fill="#7cc4ff"><animate attributeName="r" values="3;5.5;3" dur="2.4s" begin="1.80s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2.4s" begin="1.80s" repeatCount="indefinite"/></circle></g>
    <path d="M556 172 L570 158 M559 158 H570 V169" fill="none" stroke="#6e95a4" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="199" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
